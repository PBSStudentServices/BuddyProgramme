    function bind(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{c().tab=b.dataset.tab;save()});bindMenu();bindCohorts();const kv=$("keyView");if(kv)kv.onchange=e=>{c().keyView=e.target.value;save()};document.querySelectorAll("[data-summary]").forEach(e=>e.onchange=()=>{c().summary[e.dataset.summary]=e.value;save()});document.querySelectorAll("[data-metric]").forEach(e=>e.oninput=()=>{c().metrics[e.dataset.metric]=Number(e.value||0);save()});document.querySelectorAll("[data-task]").forEach(e=>e.onchange=()=>{const[id,k]=e.dataset.task.split(":");const t=c().tasks.find(x=>x.id===id);if(k==="status"&&e.value==="Done"&&!t.completionDate)t.completionDate=iso(today());if(k==="status"&&e.value!=="Done")t.completionDate="";t[k]=e.value;save()});document.querySelectorAll("[data-focus]").forEach(e=>e.onchange=()=>{c().focus.find(x=>x.id===e.dataset.focus).text=e.value;save()});document.querySelectorAll("[data-wait]").forEach(e=>e.onchange=()=>{const[id,k]=e.dataset.wait.split(":");c().waiting.find(x=>x.id===id)[k]=e.value;save()});document.querySelectorAll("[data-risk]").forEach(e=>e.onchange=()=>{const[id,k]=e.dataset.risk.split(":");c().risks.find(x=>x.id===id)[k]=e.value;save()});["search","phase","status","owner"].forEach(k=>{const e=$(k+"Filter");if(e)e.onchange=x=>{state.filters[k]=x.target.value;render()}});const s=$("searchFilter");if(s)s.oninput=x=>{state.filters.search=x.target.value;render()};const o=$("overdueFilter");if(o)o.onchange=x=>{state.filters.overdue=x.target.checked;render()};const inc=$("incompleteFilter");if(inc)inc.onchange=x=>{state.filters.incomplete=x.target.checked;render()}}

    function bindCohorts(){const sel=$("cohortSelect");if(!sel)return;sel.onchange=e=>{state.active=e.target.value;save()};$("newCohortBtn").onclick=()=>{const n=prompt("Cohort name","New Cohort");if(n){const cc=cohort(n);state.cohorts.push(cc);state.active=cc.id;save()}};$("renameCohortBtn").onclick=()=>{const n=prompt("New cohort name",c().name);if(n){c().name=n;save()}};$("duplicateCohortBtn").onclick=()=>{const n=cohort(c().name+" copy");n.tasks=c().tasks.map(t=>({...t,id:uid(),status:"Not Started",completionDate:""}));state.cohorts.push(n);state.active=n.id;save()};$("deleteCohortBtn").onclick=()=>{if(state.cohorts.length<2)return alert("Keep at least one cohort.");if(confirm(`Delete ${c().name}?`)){state.cohorts=state.cohorts.filter(x=>x.id!==c().id);state.active=state.cohorts[0].id;save()}}}
    function toggleTask(id){const t=c().tasks.find(x=>x.id===id);t.status=t.status==="Done"?"In Progress":"Done";t.completionDate=t.status==="Done"?iso(today()):"";save()}function toggleKey(id){c().keyOpen=c().keyOpen===id?"":id;save()}function goTask(id){if(!c().tasks.find(x=>x.id===id))return;c().tab="Tasks";c().taskFocus=id;DATES.forEach(d=>{if(tasksForKey(d).some(t=>t.id===id))c().collapsed[`${d[0]}-${slug(d[2])}`]=false});state.filters={search:"",phase:"All",status:"All",owner:"All",overdue:false,incomplete:false};save()}function addTask(){c().tasks.push({id:uid(),phase:"New Phase",timing:"",todo:"New task",owner:"Student Services",deadline:"",status:"Not Started",notes:"",completionDate:""});save()}function delTask(id){if(confirm("Delete this task?")){c().tasks=c().tasks.filter(t=>t.id!==id);save()}}function toggleFocus(id){const i=c().focus.find(x=>x.id===id);i.done=!i.done;save()}function addFocus(){c().focus.push({id:uid(),text:"New priority",done:false});save()}function delFocus(id){c().focus=c().focus.filter(i=>i.id!==id);save()}function moveFocus(i,d){const a=c().focus,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save()}function addWaiting(){c().waiting.push({id:uid(),item:"New item",owner:"",due:"",status:"Waiting"});save()}function delWaiting(id){c().waiting=c().waiting.filter(i=>i.id!==id);save()}function addRisk(){c().risks.push({id:uid(),issue:"New risk",impact:"Medium",owner:"",action:"",status:"Open"});save()}function delRisk(id){c().risks=c().risks.filter(i=>i.id!==id);save()}function addComment(){const e=$("noteText");if(e.value.trim()){c().comments.unshift({id:uid(),text:e.value.trim(),date:new Date().toISOString()});save()}}function delComment(id){c().comments=c().comments.filter(n=>n.id!==id);save()}function togglePhase(p){c().collapsed[p]=!c().collapsed[p];save()}function toggleCategory(k){c().collapsed[k]=!c().collapsed[k];save()}function clearFilters(){state.filters={search:"",phase:"All",status:"All",owner:"All",overdue:false,incomplete:false};c().taskFocus="";render()}
    function exportCsv(){const rows=[["Timing","Deadline","Phase","To-Do","Owner","Notes","Status"]].concat(c().tasks.map(t=>[t.timing,t.deadline,t.phase,t.todo,t.owner,t.notes,t.status]));download("pbs-buddy-program-tasks.csv",rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}
    function exportExcel(){const rows=c().tasks.map(t=>`<tr><td>${esc(t.timing)}</td><td>${esc(t.deadline)}</td><td>${esc(t.phase)}</td><td>${esc(t.todo)}</td><td>${esc(t.owner)}</td><td>${esc(t.notes)}</td><td>${esc(t.status)}</td></tr>`).join("");download("pbs-buddy-program-export.xls",`<html><head><meta charset="UTF-8"></head><body><table border="1"><thead><tr><th>Timing</th><th>Deadline</th><th>Phase</th><th>To-Do</th><th>Owner</th><th>Notes</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></body></html>`,"application/vnd.ms-excel")}
    function downloadTemplate(){const rows=[["Timing","Deadline","Phase","To-Do","Owner","Notes","Status"],["10 Sep","2026-09-10","Program Setup","Example task","Student Services","","Not Started"]];download("pbs-buddy-program-import-template.csv",rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}
    function checkOverdue(){c().tab="Tasks";state.filters={search:"",phase:"All",status:"All",owner:"All",overdue:true,incomplete:false};save()}
    function exportHtml(){localStorage.setItem(STORE,JSON.stringify(state));let html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;const payload=`<script>try{localStorage.setItem(${JSON.stringify(STORE)},${JSON.stringify(JSON.stringify(state))});}catch(e){}<\/script>`;html=html.replace("</body>",payload+"</body>");download("pbs-buddy-program-tracker-saved.html",html,"text/html")}
    function exportJson(){download("pbs-buddy-program-backup.json",JSON.stringify(state,null,2),"application/json")}function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}$("jsonImport").onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.cohorts)throw Error();state=p;save()}catch{alert("Could not import this JSON backup.")}};r.readAsText(file)};
    render();
  </script>
